packages:
  - test/runtimes/alpha3
  - test/runtimes/rc2
  - test/runtimes/rc4-zod443

autoInstallPeers: false

# Do not mix SDK declarations through a shared pool; retain native add-on hoisting.
hoistPattern:
  - '*'
  - '!@deepseek-ai/dsh-*'

# Align the current SDK declarations without replacing the oldest SDK's real provider.
overrides:
  '@deepseek-ai/dsh-session-projection@0.2.1-rc.4>zod': 4.6.7
