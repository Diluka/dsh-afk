packages:
  - test/fixtures/runtime-next

autoInstallPeers: false

# Do not mix SDK declarations through a shared pool; retain native add-on hoisting.
hoistPattern:
  - '*'
  - '!@deepseek-ai/dsh-*'

# Align only rc.1 projection declarations with its selected Zod provider.
# rc.2 already declares its own exact Zod 4.6.6; do not override that fixture.
overrides:
  '@deepseek-ai/dsh-session-projection@0.2.2-rc.1>zod': 4.6.7
