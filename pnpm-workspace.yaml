packages:
  - test/fixtures/runtime-next

autoInstallPeers: false

# Do not mix SDK declarations through a shared pool; retain native add-on hoisting.
hoistPattern:
  - '*'
  - '!@deepseek-ai/dsh-*'

# Align the projection declarations with the Zod provider selected for each root.
# The rc.3 fixture already declares its own exact Zod 4.6.7; do not override it.
overrides:
  '@deepseek-ai/dsh-session-projection@0.2.2-rc.3>zod': 4.6.7
