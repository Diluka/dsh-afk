packages:
  - test/runtimes/rc2

autoInstallPeers: false

# Do not mix SDK declarations through a shared pool; retain native add-on hoisting.
hoistPattern:
  - '*'
  - '!@deepseek-ai/dsh-*'

# Keep the projection declaration's Zod identity aligned with our schema library.
# The tested Host uses the same Zod 4 API; two minor-version type identities conflict.
overrides:
  '@deepseek-ai/dsh-session-projection>zod': 4.6.7
