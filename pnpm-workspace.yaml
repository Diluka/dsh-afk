packages:
  - test/fixtures/runtime-next
  - test/fixtures/runtime-min

autoInstallPeers: false

# Do not mix SDK declarations through a shared pool; retain native add-on hoisting.
hoistPattern:
  - '*'
  - '!@deepseek-ai/dsh-*'

# Align each projection declaration with the Zod provider selected for its root.
# The fixtures declare their own exact Zod; do not override them.
overrides:
  '@deepseek-ai/dsh-session-projection@0.2.2-rc.1>zod': 4.6.7
  '@deepseek-ai/dsh-session-projection@0.2.2-rc.3>zod': 4.6.7
