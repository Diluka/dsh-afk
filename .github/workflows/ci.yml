name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} / DSH ${{ matrix.dsh.version }} (${{ matrix.dsh.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
        dsh:
          - role: 'latest'
            version: '0.2.1-rc.2'
            directory: 'test/runtimes/rc2'
            zod: '4.4.3'
          - role: 'next'
            version: '0.2.1-rc.5'
            directory: '.'
            zod: '4.6.7'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check JavaScript syntax
        run: pnpm run check
      - name: Check JSDoc types without emitting JavaScript
        run: pnpm run typecheck
      - name: Test source against the pinned real DSH SDKs
        env:
          DSH_TEST_RUNTIME_DIR: ${{ github.workspace }}/${{ matrix.dsh.directory }}
          DSH_TEST_RUNTIME_VERSION: ${{ matrix.dsh.version }}
          DSH_TEST_ZOD_VERSION: ${{ matrix.dsh.zod }}
        run: |
          pnpm run test:runtime | tee source-tests.tap
          node -e "const fs=require('node:fs'); const text=fs.readFileSync('source-tests.tap','utf8'); if(!/^# skipped 0$/m.test(text)) throw new Error('Integration checks were skipped');"
      - name: Pack and inspect the distributable
        run: |
          mkdir -p artifacts/unpacked
          pnpm pack --out artifacts/dsh-afk-ci.tgz
          tar -xzf artifacts/dsh-afk-ci.tgz -C artifacts/unpacked
          node --input-type=module -e "import { readFile, access } from 'node:fs/promises'; const p=JSON.parse(await readFile('artifacts/unpacked/package/package.json','utf8')); for(const f of ['index.js','state.js','config.js','history.js','client.js','icon.svg','locale/en.json','locale/zh.json','types/afk.d.ts','types/host.d.ts','types/client.d.ts','types/history.d.ts']) await access('artifacts/unpacked/package/'+f); if(p.engines.dsh!=='>=0.2.1-alpha.3 <=0.2.1-rc.5') throw new Error('Unexpected compatibility target');"
      - name: Typecheck standalone packed JavaScript and declarations
        run: |
          node --input-type=module -e "import { writeFile } from 'node:fs/promises'; await writeFile('artifacts/tsconfig.package.json',JSON.stringify({extends:'../tsconfig.json',include:['unpacked/package/*.js','unpacked/package/types/**/*.d.ts'],exclude:[]}));"
          pnpm exec tsc -p artifacts/tsconfig.package.json --pretty false
      - name: Test the packed plugin against the same real DSH SDKs
        env:
          DSH_TEST_RUNTIME_DIR: ${{ github.workspace }}/${{ matrix.dsh.directory }}
          DSH_TEST_RUNTIME_VERSION: ${{ matrix.dsh.version }}
          DSH_TEST_ZOD_VERSION: ${{ matrix.dsh.zod }}
          DSH_TEST_PLUGIN_DIR: ${{ github.workspace }}/artifacts/unpacked/package
        run: |
          pnpm run test:runtime | tee package-tests.tap
          node -e "const fs=require('node:fs'); const text=fs.readFileSync('package-tests.tap','utf8'); if(!/^# skipped 0$/m.test(text)) throw new Error('Packed integration checks were skipped');"
